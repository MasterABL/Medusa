name: CI

# Roda exatamente os gates já mandatados por .ai/QA_GATE.md (Test Gate + Build Gate).
# Lint foi deliberadamente omitido: ESLint nunca foi configurado neste repo (next lint pede
# configuração interativa, o que travaria em CI) — ver .ai/DECISIONS.md e .ai/BLOCKERS.md.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gates:
    name: Typecheck, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Achado real de review: por padrão o checkout grava o GITHUB_TOKEN nas credenciais git
          # locais, deixando-o disponível pra qualquer processo filho — inclusive `npm ci`/`npm
          # run build` a seguir, que executam código arbitrário do PR (scripts de instalação,
          # build). Este workflow nunca precisa fazer push/API call com esse token, então ele não
          # tem motivo pra existir no ambiente de build.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
